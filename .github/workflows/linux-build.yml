name: Linux build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libsamplerate: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libyaml-cpp-dev libspdlog-dev libsamplerate0-dev python3 python3-pip python3-venv libsndfile1 libsndfile1-dev libportaudio2 libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSONITUDE_FETCH_DEPS=OFF
          -DSONITUDE_WITH_ALSA=ON
          -DSONITUDE_WITH_LIBSAMPLERATE=${{ matrix.libsamplerate }}
      - name: Build
        run: cmake --build build
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Python test bench (pytest + real C++ tools)
        working-directory: testbench
        env:
          SONITUDE_BUILD_DIR: ${{ github.workspace }}/build
          SONITUDE_REQUIRE_CPP: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest -q --tb=short
      - name: Confirm C++ tools exist
        env:
          SONITUDE_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          test -x "$SONITUDE_BUILD_DIR/sonitude_wav_replay"
          test -x "$SONITUDE_BUILD_DIR/sonitude_stream_process"
