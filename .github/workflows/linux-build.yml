name: Linux build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libsamplerate: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libyaml-cpp-dev libspdlog-dev libsamplerate0-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSONITUDE_FETCH_DEPS=OFF
          -DSONITUDE_WITH_ALSA=ON
          -DSONITUDE_WITH_LIBSAMPLERATE=${{ matrix.libsamplerate }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
